<!DOCTYPE html>
<html>
<head>
    <title>Mening saytim</title>
</head>

<body>

    <h1>Xush kelibsiz! ❤️</h1>

    <h2>Mening saytimga xush kelibsiz!</h2>

    <p>Iltimos, quyidagi ma'lumotlarni kiriting:</p>

    <form action="index2.html">

        <label for="name">Ism:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Ismingizni kiriting"
            required
        >

        <br><br>

        <label for="surname">Familiya:</label>
        <input
            type="text"
            id="surname"
            name="surname"
            placeholder="Familiyangizni kiriting"
            required
        >

        <br><br>

        <label for="email">Elektron pochta:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
        >

        <br><br>

        <label>Jins:</label>

        <label for="male">Erkak</label>
        <input
            type="radio"
            name="gender"
            id="male"
            value="erkak"
            required
        >

        <label for="female">Ayol</label>
        <input
            type="radio"
            name="gender"
            id="female"
            value="ayol"
        >

        <br><br>

        <button type="submit">Submit</button>

        <input type="reset" value="Tozalash">

    </form>

</body>
</html>
